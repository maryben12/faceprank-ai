
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FacePrank AI</title>

<style>
* { box-sizing: border-box; }

body {
  background: #101323;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}

.container {
  max-width: 800px;
  margin: 25px auto;
  padding: 20px;
  background: #1c2138;
  border-radius: 18px;
}

button {
  background: #7465ed;
  color: white;
  border: 0;
  padding: 13px 20px;
  margin: 8px;
  border-radius: 8px;
  cursor: pointer;
}

.preview {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}

.preview > div {
  width: 100%;
  max-width: 320px;
}

img, video {
  width: 100%;
  border-radius: 12px;
}

.camera-wrap {
  position: relative;
  width: 100%;
}

.camera-wrap canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#status { color: #55edaa; }

</style>
</head>

<body>

<h1 style="color:#9185ff">FACEPRANK AI</h1>
<p>Bring your uploaded photo to life!</p>

<div class="container">

<h2>Upload a Face</h2>

<input type="file" id="photo" accept="image/*">

<div class="preview">

<div>
<h3>Uploaded Photo</h3>
<img id="imagePreview" alt="Uploaded photo">
</div>

<div>
<h3>Your Webcam + AI Tracker</h3>
<div class="camera-wrap">
<video id="camera" autoplay muted playsinline></video>
<canvas id="trackingCanvas"></canvas>
</div>
</div>

</div>

<button id="startCamera">Start AI Tracking</button>
<button id="stopCamera">Stop Camera</button>

<p id="status">Upload a photo and start tracking.</p>

<p>Green dots show detected facial landmarks.</p>

</div>

<script type="module">

import {
  initializeFaceTracking,
  trackFace
} from "./face.js";

const camera = document.getElementById("camera");
const canvas = document.getElementById("trackingCanvas");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");

let stream = null;
let running = false;

document.getElementById("photo").onchange = event => {
  const file = event.target.files[0];
  if (file) {
    document.getElementById("imagePreview").src =
      URL.createObjectURL(file);
  }
};

document.getElementById("startCamera").onclick = async () => {
  try {
    status.textContent = "Starting camera...";

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        width: { ideal: 320 },
        height: { ideal: 240 },
        frameRate: { ideal: 15, max: 15 }
      },
      audio: false
    });

    camera.srcObject = stream;
    await camera.play();

    status.textContent = "Loading AI face tracker...";

    const ready = await initializeFaceTracking();

    if (!ready) return;

    running = true;
    status.textContent = "AI TRACKING ACTIVE!";

    detectLoop();

  } catch (error) {
    console.error(error);
    status.textContent = "Error: " + error.message;
  }
};

function detectLoop() {
  if (!running) return;

  if (camera.readyState >= 2) {
    const width = camera.videoWidth;
    const height = camera.videoHeight;

    if (width && height) {
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }

      ctx.clearRect(0, 0, width, height);

      try {
        const result = trackFace(camera);

        if (result && result.faceLandmarks &&
            result.faceLandmarks.length > 0) {

          const points = result.faceLandmarks[0];

          ctx.fillStyle = "#00ff88";

          for (const point of points) {
            ctx.beginPath();
            ctx.arc(
              point.x * width,
              point.y * height,
              1.5,
              0,
              Math.PI * 2
            );
            ctx.fill();
          }

          status.textContent =
            "FACE DETECTED! " + points.length +
            " tracking points.";
        } else {
          status.textContent = "Looking for a face...";
        }

      } catch (error) {
        console.error(error);
        status.textContent = "Tracking error: " + error.message;
        running = false;
        return;
      }
    }
  }

  requestAnimationFrame(detectLoop);
}

document.getElementById("stopCamera").onclick = () => {
  running = false;

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  camera.srcObject = null;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  status.textContent = "Camera stopped.";
};

</script>

</body>
</html>
